parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Brain\Vault:
        arguments:
            $root: '%kernel.project_dir%/notes'

    Symfony\AI\Store\Document\Transformer\TextSplitTransformer: ~

    App\Security\IntrospectionTokenHandler:
        arguments:
            $introspectionUrl: '%env(OAUTH_INTROSPECTION_URL)%'
            $clientId: '%env(OAUTH_RESOURCE_CLIENT_ID)%'
            $clientSecret: '%env(OAUTH_RESOURCE_CLIENT_SECRET)%'
            $audience: '%env(OAUTH_AUDIENCE)%'

    App\Brain\QueryVectorizer:
        arguments:
            $inner: '@ai.vectorizer.cohere'
